name: Moodle GKE CI/CD Deployment

on:
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

env:
  PROJECT_ID: civic-champion-439320-a5
  REGION: northamerica-northeast2
  CLUSTER_NAME: moodle-gke-cluster
  CLUSTER_LOCATION: northamerica-northeast2-a
  IMAGE: northamerica-northeast2-docker.pkg.dev/civic-champion-439320-a5/moodle-repo/custom-php:8.2

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v7
      
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          workload_identity_provider: projects/1006034492977/locations/global/workloadIdentityPools/github/providers/cloud-infra-single-node
          service_account: github-actions@${{ env.PROJECT_ID }}.iam.gserviceaccount.com
          project_id: ${{ env.PROJECT_ID }}
    
      - name: Set up Google Cloud SDK
        uses: google-github-actions/setup-gcloud@v3
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Install GKE auth plugin
        run: |
          gcloud components install gke-gcloud-auth-plugin --quiet
          gke-gcloud-auth-plugin --version

      - name: Verify Google Cloud authentication
        run: |
          gcloud auth list
          gcloud config get-value project
          
      - name: Set up Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        working-directory: terraform/gcp-gke
        run: terraform init

      - name: Terraform Validate
        working-directory: terraform/gcp-gke
        run: terraform validate

      - name: Terraform Plan
        working-directory: terraform/gcp-gke
        run: terraform plan -no-color -input=false -var="project_id=${{ env.PROJECT_ID }}"
        
      - name: Terraform Apply
        working-directory: terraform/gcp-gke
        run: terraform apply -auto-approve -input=false -var="project_id=${{ env.PROJECT_ID }}"

      - name: Configure Artifact Registry authentication
        run: |
          gcloud auth configure-docker \
            "${REGION}-docker.pkg.dev" \
            --quiet

      - name: Build PHP image
        run: |
          docker build \
            -t "$IMAGE" \
            docker/php

      - name: Push PHP image
        run: |
          docker push "$IMAGE"

      - name: Verify PHP image
        run: |
          gcloud artifacts docker images describe "$IMAGE" 

      - name: Get GKE credentials
        uses: google-github-actions/get-gke-credentials@v3
        with:
          cluster_name: ${{ env.CLUSTER_NAME }}
          location: ${{ env.CLUSTER_LOCATION }}
          project_id: ${{ env.PROJECT_ID }}

      - name: Verify GKE connection
        run: |
          kubectl cluster-info
          kubectl get nodes
      
      - name: Create Kubernetes SQL secrets
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MYSQL_MOODLE_PASSWORD: ${{ secrets.MYSQL_MOODLE_PASSWORD }}
        run: |
          cat > kubernetes/gcp-gke/mysql/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: mysql-secret
          type: Opaque
          stringData:
            root-password: "${MYSQL_ROOT_PASSWORD}"
            mysql-database: moodle
            mysql-user: moodleuser
            moodleuser-password: "${MYSQL_MOODLE_PASSWORD}"
          EOF

      - name: Create Kubernetes PHP secret
        env:
          MYSQL_MOODLE_PASSWORD: ${{ secrets.MYSQL_MOODLE_PASSWORD }}
        run: |
          cat > kubernetes/gcp-gke/php/secret.yaml <<EOF
          apiVersion: v1
          kind: Secret
          metadata:
            name: php-secret
          type: Opaque
          stringData:
            db-password: "${MYSQL_MOODLE_PASSWORD}"
          EOF
          
      - name: Deploy Kubernetes workloads to GKE
        run: |
          bash scripts/deploy-gke.sh
          
      - name: Verify GKE deployment
        run: |
          kubectl get pods
          kubectl get pvc
          kubectl get ingress moodle-ingress
          
      - name: Create Moodle admin secret
        run: |
          kubectl create secret generic moodle-admin-secret \
            --from-literal=admin-password="${{ secrets.MOODLE_ADMIN_PASSWORD }}" \
            --dry-run=client -o yaml | kubectl apply -f -
            
      - name: Install and configure Moodle
        run: |
          bash scripts/configure-moodle.sh
