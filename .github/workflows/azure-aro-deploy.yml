name: Moodle ARO CI/CD Deployment

on:
  push:
    branches: [ main ]
  workflow_dispatch:

env:
  AZURE_RESOURCE_GROUP: "rg-moodle-aro"
  AZURE_ARO_CLUSTER: "moodle-aro-cluster"
  AZURE_ACR_NAME: "moodlearoregistry"
  ACR_LOGIN_SERVER: "moodlearoregistry.azurecr.io"
  TF_VAR_aro_client_id: "${{ secrets.AZURE_CLIENT_ID }}"
  TF_VAR_aro_client_secret: "${{ secrets.AZURE_SP_SECRET }}"

jobs:
  deploy-infrastructure:
    name: Provision Infrastructure & Deploy ARO
    runs-on: ubuntu-latest
    outputs:
      aro_api_url: ${{ steps.aro-outputs.outputs.api_url }}
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SP_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Set Active Subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Verify Terraform Environment Variables
        run: |
          test -n "$TF_VAR_aro_client_id" && echo "PASS: ARO client ID is set"
          test -n "$TF_VAR_aro_client_secret" && echo "PASS: ARO client secret is set"

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v3

      - name: Terraform Init
        run: terraform init
        working-directory: ./terraform # Update if terraform files are in a specific subfolder

      - name: Terraform Validate
        run: terraform validate
        working-directory: ./terraform

      - name: Terraform Apply
        run: terraform apply -auto-approve
        working-directory: ./terraform

      - name: Get ARO API Endpoint
        id: aro-outputs
        run: |
          API_URL=$(az aro show --name ${{ env.AZURE_ARO_CLUSTER }} --resource-group ${{ env.AZURE_RESOURCE_GROUP }} --query "apiserverProfile.url" -o tsv)
          echo "api_url=$API_URL" >> $GITHUB_OUTPUT

  build-and-push-images:
    name: Build & Push Containers to ACR
    needs: deploy-infrastructure
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SP_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v1
        with:
          login-server: ${{ env.ACR_LOGIN_SERVER }}
          username: ${{ secrets.AZURE_CLIENT_ID }}
          password: ${{ secrets.AZURE_SP_SECRET }}

      - name: Build and Push Custom PHP-FPM Image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.ACR_LOGIN_SERVER }}/custom-php:8.2 \
            ./docker/php
          docker push ${{ env.ACR_LOGIN_SERVER }}/custom-php:8.2

      - name: Build and Push Moodle Initialization Image
        run: |
          docker build \
            --no-cache \
            -t ${{ env.ACR_LOGIN_SERVER }}/moodle-init:8.2 \
            ./kubernetes/azure-aro/images/moodle-init
          docker push ${{ env.ACR_LOGIN_SERVER }}/moodle-init:8.2

  deploy-workloads:
    name: Deploy Workloads to OpenShift
    needs: [deploy-infrastructure, build-and-push-images]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Authenticate to Azure
        uses: azure/login@v2
        with:
          creds: '{"clientId":"${{ secrets.AZURE_CLIENT_ID }}","clientSecret":"${{ secrets.AZURE_SP_SECRET }}","subscriptionId":"${{ secrets.AZURE_SUBSCRIPTION_ID }}","tenantId":"${{ secrets.AZURE_TENANT_ID }}"}'

      - name: Set Active Subscription
        run: az account set --subscription "${{ secrets.AZURE_SUBSCRIPTION_ID }}"

      - name: Install OpenShift CLI (oc)
        uses: redhat-actions/oc-installer@v1
        with:
          version: 'latest'

      - name: Run ARO Pre-Deployment Script
        env:
          MYSQL_ROOT_PASSWORD: ${{ secrets.MYSQL_ROOT_PASSWORD }}
          MOODLE_DB_PASSWORD: ${{ secrets.MYSQL_MOODLE_PASSWORD }}
          MOODLE_ADMIN_PASSWORD: ${{ secrets.MOODLE_ADMIN_PASSWORD }}
        run: |
          bash scripts/pre-deploy-aro.sh

      - name: Deploy Persistent Storage
        run: oc apply -k kubernetes/azure-aro/storage

      - name: Deploy MySQL Database
        run: oc apply -k kubernetes/azure-aro/mysql

      - name: Deploy PHP-FPM Application
        run: oc apply -k kubernetes/azure-aro/php

      - name: Deploy Nginx Web Server
        run: oc apply -k kubernetes/azure-aro/nginx

      - name: Deploy OpenShift Networking Overlay
        run: oc apply -k kubernetes/azure-aro/overlays

      - name: Run OpenShift Verification
        run: bash scripts/verify-openshift.sh

      - name: Configure Moodle for ARO
        run: bash scripts/configure-moodle-aro.sh

```